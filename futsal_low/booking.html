<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalSpace — Booking confirmation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="index.html" class="brand">GoalSpace</a>
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="courts.html">Courts</a><a href="dashboard.html">Dashboard</a>
            </div>
        <div class="auth-links">
            <a href="dashboard.html" class="btn btn-outline btn-sm">Dashboard</a>
        </div>
    </div>
</nav>

<section class="section" style="padding-top:80px">
    <div class="container">
        <!-- Progress steps -->
        <div style="display:flex; justify-content:space-between; margin-bottom:32px; padding:0 8px">
            <div style="text-align:center; flex:1">
                <div style="width:28px; height:28px; background:#333; color:#fff; border-radius:50%; line-height:28px; margin:0 auto; font-weight:700; font-size:13px">1</div>
                <div style="font-size:12px; margin-top:4px; color:var(--text-secondary)">Select court</div>
            </div>
            <div style="text-align:center; flex:1">
                <div style="width:28px; height:28px; background:#333; color:#fff; border-radius:50%; line-height:28px; margin:0 auto; font-weight:700; font-size:13px">2</div>
                <div style="font-size:12px; margin-top:4px; color:var(--text-secondary)">Choose slot</div>
            </div>
            <div style="text-align:center; flex:1">
                <div style="width:28px; height:28px; background:#333; color:#fff; border-radius:50%; line-height:28px; margin:0 auto; font-weight:700; font-size:13px">3</div>
                <div style="font-size:12px; margin-top:4px; color:var(--text-secondary)">Payment</div>
            </div>
            <div style="text-align:center; flex:1">
                <div style="width:28px; height:28px; background:#e0e0e0; color:#999; border-radius:50%; line-height:28px; margin:0 auto; font-weight:700; font-size:13px">4</div>
                <div style="font-size:12px; margin-top:4px; color:var(--text-secondary)">Confirmation</div>
            </div>
        </div>

        <div class="grid" style="grid-template-columns:1fr 1fr; gap:32px">
            <!-- Left: court summary -->
            <div>
                <div class="card">
                    <div class="placeholder" style="height:140px; border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; color:#999">GROUND PHOTO</div>
                    <div class="card-body">
                        <span class="eyebrow">Booking summary</span>
                        <h2 class="ph-title" style="margin-top:8px"></h2>
                        <div class="ph-sub"></div>
                        <div class="ph-sub" style="margin-top:4px; width:70%"></div>

                        <div style="margin-top:16px">
                            <div class="ph-line" style="width:100%; height:14px; margin-bottom:6px"></div>
                            <div class="ph-line" style="width:100%; height:14px; margin-bottom:6px"></div>
                            <div class="ph-line" style="width:100%; height:14px; margin-bottom:6px"></div>
                            <div class="ph-line" style="width:70%; height:14px"></div>
                        </div>

                        <div style="margin-top:16px; padding-top:12px; border-top:1px solid var(--border)">
                            <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px">
                                <span style="color:var(--text-secondary)">Subtotal</span>
                                <span class="ph-line" style="width:50px; height:16px; display:inline-block"></span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px">
                                <span style="color:var(--text-secondary)">Tax</span>
                                <span class="ph-line" style="width:50px; height:16px; display:inline-block"></span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:18px; font-weight:700; margin-top:8px">
                                <span>Total</span>
                                <span class="ph-line" style="width:60px; height:18px; display:inline-block"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: payment form -->
            <div>
                <h3 style="font-size:16px; font-weight:600; margin-bottom:16px">Payment method</h3>
                <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px">
                    <div style="display:flex; align-items:center; gap:8px; padding:10px; border:1px dashed var(--border); border-radius:8px">
                        <span style="font-size:13px; color:var(--text-secondary)">Credit Card</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; padding:10px; border:1px dashed var(--border); border-radius:8px">
                        <span style="font-size:13px; color:var(--text-secondary)">Cash</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; padding:10px; border:1px dashed var(--border); border-radius:8px">
                        <span style="font-size:13px; color:var(--text-secondary)">Mobile Wallet</span>
                    </div>
                </div>

                <div class="form-group">
                    <label style="font-size:12px; color:var(--text-secondary)">Card number</label>
                    <input type="text" placeholder="1234 5678 9012 3456">
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
                    <div class="form-group">
                        <label style="font-size:12px; color:var(--text-secondary)">Expiry</label>
                        <input type="text" placeholder="MM/YY">
                    </div>
                    <div class="form-group">
                        <label style="font-size:12px; color:var(--text-secondary)">CVV</label>
                        <input type="text" placeholder="123">
                    </div>
                </div>

                <div class="form-actions">
                    <a href="receipt.html" class="btn btn-primary" style="width:100%; justify-content:center">Confirm &amp; pay</a>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="site-footer">
    <div class="container">
        <div class="footer-brand">GoalSpace</div>
        <div><a href="index.html">Home</a><a href="courts.html">Courts</a><a href="dashboard.html">Dashboard</a></div>
        <div><a href="#">Privacy</a><a href="#">Terms</a></div>
    </div>
    <div class="footer-bottom"><p>&copy; 2026 GoalSpace. All rights reserved.</p></div>
</footer>
</body>
</html>
