<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalSpace — Player dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="index.html" class="brand">GoalSpace</a>
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="courts.html">Courts</a>
            <a href="my_bookings.html">My bookings</a>
            <a href="dashboard.html" class="active">Dashboard</a>
        </div>
        <div class="auth-links">
            <a href="#" class="btn btn-outline btn-sm"><i class="fa-solid fa-user"></i></a>
            <a href="logout.html" class="btn btn-primary btn-sm">Logout</a>
        </div>
    </div>
</nav>

<section class="section" style="padding-top:80px">
    <div class="container">
        <!-- Welcome banner -->
        <div class="card" style="background:#111; color:#fff; border:2px solid #333; border-radius:12px; overflow:hidden; margin-bottom:24px">
            <div style="padding:32px; display:flex; align-items:center; gap:16px">
                <div class="placeholder" style="width:80px; height:80px; border-radius:50%; border:2px dashed #444; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0">
                    <span style="font-size:28px; color:#fff">?</span>
                </div>
                <div>
                    <span class="eyebrow" style="color:#aaa">Player dashboard</span>
                    <h1 style="font-size:24px; font-weight:700; margin-top:4px">
                        Good morning, <span class="ph-line" style="width:90px; height:24px; vertical-align:baseline; background:#333; border-radius:3px; display:inline-block"></span>
                    </h1>
                    <p style="opacity:0.7; margin-top:4px; font-size:14px">
                        <span class="ph-line" style="width:60%; height:16px; background:#333; display:inline-block; border-radius:2px"></span>
                    </p>
                </div>
            </div>
        </div>

        <!-- Quick actions -->
        <div style="display:flex; gap:12px; margin-bottom:28px; flex-wrap:wrap">
            <a href="courts.html" class="btn btn-primary">Find a court</a>
            <a href="my_bookings.html" class="btn btn-outline">My bookings</a>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat">
                <div class="num">
                    <span class="ph-line" style="width:24px; height:24px; display:inline-block; font-size:24px; font-weight:700">7</span>
                </div>
                <div class="lbl">Total bookings</div>
            </div>
            <div class="stat">
                <div class="num">
                    <span class="ph-line" style="width:20px; height:24px; display:inline-block">3</span>
                </div>
                <div class="lbl">Confirmed</div>
            </div>
            <div class="stat">
                <div class="num">
                    <span class="ph-line" style="width:30px; height:24px; display:inline-block">12,500</span>
                </div>
                <div class="lbl">Spent</div>
            </div>
        </div>
    </div>
</section>

<footer class="site-footer">
    <div class="container">
        <div class="footer-brand">GoalSpace</div>
        <div><a href="index.html">Home</a><a href="courts.html">Courts</a><a href="my_bookings.html">My bookings</a></div>
        <div><a href="#">Privacy</a><a href="#">Terms</a></div>
    </div>
    <div class="footer-bottom"><p>&copy; 2026 GoalSpace. All rights reserved.</p></div>
</footer>
</body>
</html>
